name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release-neutral workflow regression gate
        run: python -B tools/release_guard_selftest.py

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\app.res app.rc
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 ^
             /Fo:build\ ^
             src\main.cpp ^
             build\app.res ^
             /Fe:AITaskManager.exe ^
             user32.lib gdi32.lib comctl32.lib psapi.lib shell32.lib dwmapi.lib msimg32.lib advapi32.lib

      - name: Core and safety tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\core_selftest.cpp /Fe:build\core_selftest.exe
          if errorlevel 1 exit /b 1
          build\core_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\confirmation_selftest.cpp /Fe:build\confirmation_selftest.exe
          if errorlevel 1 exit /b 1
          build\confirmation_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\safety_selftest.cpp /Fe:build\safety_selftest.exe
          if errorlevel 1 exit /b 1
          build\safety_selftest.exe
          if errorlevel 1 exit /b 1

      - name: P0 safety evidence and graceful exit tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\policy_evidence_selftest.cpp /Fe:build\policy_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\policy_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\signature_selftest.cpp /Fe:build\signature_selftest.exe
          if errorlevel 1 exit /b 1
          build\signature_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\graceful_selftest.cpp /Fe:build\graceful_selftest.exe
          if errorlevel 1 exit /b 1
          build\graceful_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Structured diagnostic evidence tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\diagnostic_evidence_selftest.cpp /Fe:build\diagnostic_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\diagnostic_evidence_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Identity-bound process IO tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\io_metrics_selftest.cpp /Fe:build\io_metrics_selftest.exe
          if errorlevel 1 exit /b 1
          build\io_metrics_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\io_windows_selftest.cpp /Fe:build\io_windows_selftest.exe
          if errorlevel 1 exit /b 1
          build\io_windows_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Benchmark harness smoke test (not a product comparison)
        shell: pwsh
        run: |
          $hash = (Get-FileHash (Get-Process -Id $PID).Path).Hash
          ./tools/benchmark.ps1 -ProcessId $PID -Label AITaskManager -ExpectedSha256 $hash -Revision harness-smoke -Scenario self -OutputDirectory build/bench-a -Samples 10 -IntervalMs 100
          ./tools/benchmark.ps1 -ProcessId $PID -Label Argus -ExpectedSha256 $hash -Revision harness-smoke -Scenario self -OutputDirectory build/bench-b -Samples 10 -IntervalMs 100
          ./tools/benchmark-compare.ps1 -AITaskManagerDirectory build/bench-a -ArgusDirectory build/bench-b

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-harness-smoke-not-product-results
          path: build/bench-*
          if-no-files-found: ignore

      - name: Show artifact
        shell: pwsh
        run: |
          Get-Item AITaskManager.exe | Select-Object Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: AITaskManager
          path: AITaskManager.exe
          retention-days: 30
