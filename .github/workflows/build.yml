name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Unsigned artifact candidate only; never publishes a release'
        required: true
        default: validation
        type: choice
        options: [validation, nightly-candidate, stable-candidate]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\app.res app.rc
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 ^
             /Fo:build\ ^
             src\main.cpp ^
             build\app.res ^
             /Fe:AITaskManager.exe ^
             user32.lib gdi32.lib comctl32.lib psapi.lib shell32.lib dwmapi.lib msimg32.lib advapi32.lib

      - name: Core and safety tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\core_selftest.cpp /Fe:build\core_selftest.exe
          if errorlevel 1 exit /b 1
          build\core_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\confirmation_selftest.cpp /Fe:build\confirmation_selftest.exe
          if errorlevel 1 exit /b 1
          build\confirmation_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\safety_selftest.cpp /Fe:build\safety_selftest.exe
          if errorlevel 1 exit /b 1
          build\safety_selftest.exe
          if errorlevel 1 exit /b 1

      - name: P0 safety evidence and graceful exit tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\policy_evidence_selftest.cpp /Fe:build\policy_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\policy_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\signature_selftest.cpp /Fe:build\signature_selftest.exe
          if errorlevel 1 exit /b 1
          build\signature_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\graceful_selftest.cpp /Fe:build\graceful_selftest.exe
          if errorlevel 1 exit /b 1
          build\graceful_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Structured diagnostic evidence tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\diagnostic_evidence_selftest.cpp /Fe:build\diagnostic_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\diagnostic_evidence_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Identity-bound process IO tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\io_metrics_selftest.cpp /Fe:build\io_metrics_selftest.exe
          if errorlevel 1 exit /b 1
          build\io_metrics_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\io_windows_selftest.cpp /Fe:build\io_windows_selftest.exe
          if errorlevel 1 exit /b 1
          build\io_windows_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Resource event and freshness tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\resource_events_selftest.cpp /Fe:build\resource_events_selftest.exe
          if errorlevel 1 exit /b 1
          build\resource_events_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Provided fault text evidence tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\fault_evidence_selftest.cpp /Fe:build\fault_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\fault_evidence_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Read-only TCP listener evidence tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\port_query_selftest.cpp /Fe:build\port_query_selftest.exe
          if errorlevel 1 exit /b 1
          build\port_query_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\port_evidence_selftest.cpp /Fe:build\port_evidence_selftest.exe
          if errorlevel 1 exit /b 1
          build\port_evidence_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Shared process identity tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\process_identity_selftest.cpp /Fe:build\process_identity_selftest.exe
          if errorlevel 1 exit /b 1
          build\process_identity_selftest.exe
          if errorlevel 1 exit /b 1

      - name: Read-only CLI build and unit tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\readonly_command_selftest.cpp /Fe:build\readonly_command_selftest.exe
          if errorlevel 1 exit /b 1
          build\readonly_command_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\readonly_json_selftest.cpp /Fe:build\readonly_json_selftest.exe
          if errorlevel 1 exit /b 1
          build\readonly_json_selftest.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ src\readonly_cli.cpp /Fe:AITaskManagerReadOnly.exe psapi.lib
          if errorlevel 1 exit /b 1

      - name: Read-only CLI integration smoke
        shell: pwsh
        run: ./tools/readonly_cli_smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: AITaskManagerReadOnly
          path: AITaskManagerReadOnly.exe
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optional read-only MCP dependencies
        shell: pwsh
        run: python -m pip install -r requirements-mcp.txt

      - name: Read-only MCP backend and official protocol tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/mcp_backend_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/mcp_protocol_selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/mcp_protocol_selftest.py --cli "${{ github.workspace }}/AITaskManagerReadOnly.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Offline optional explanation boundary tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/llm_boundary_selftest.py

      - name: Offline optional transport tests (network blocked)
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/llm_transport_selftest.py

      - name: Optional LLM worker deadline tests (offline subprocesses only)
        shell: pwsh
        run: python tools/llm_deadline_selftest.py

      - name: Controlled owned-loopback bind failure demo
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /W3 /Fo:build\ tools\demo_port_conflict.cpp /Fe:build\demo_port_conflict.exe
          if errorlevel 1 exit /b 1
          build\demo_port_conflict.exe
          if errorlevel 1 exit /b 1

      - name: Benchmark harness smoke test (not a product comparison)
        shell: pwsh
        run: |
          $hash = (Get-FileHash (Get-Process -Id $PID).Path).Hash
          ./tools/benchmark.ps1 -ProcessId $PID -Label AITaskManager -ExpectedSha256 $hash -Revision harness-smoke -Scenario self -OutputDirectory build/bench-a -Samples 10 -IntervalMs 100
          ./tools/benchmark.ps1 -ProcessId $PID -Label Argus -ExpectedSha256 $hash -Revision harness-smoke -Scenario self -OutputDirectory build/bench-b -Samples 10 -IntervalMs 100
          ./tools/benchmark-compare.ps1 -AITaskManagerDirectory build/bench-a -ArgusDirectory build/bench-b

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-harness-smoke-not-product-results
          path: build/bench-*
          if-no-files-found: ignore

      - name: Show artifact
        shell: pwsh
        run: |
          Get-Item AITaskManager.exe | Select-Object Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: AITaskManager
          path: AITaskManager.exe
          retention-days: 30

      - name: Verify release-negative channel policy
        shell: pwsh
        run: python tools/release_channel_selftest.py

      - name: Select artifact channel
        id: channel
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: python tools/build_channel.py

      - name: Package unsigned candidates and integrity manifest
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: python tools/package_candidate.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.channel }}-${{ github.sha }}
          path: build/candidate/
          if-no-files-found: error
          retention-days: 30
